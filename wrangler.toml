name = "worktime"
main = "src/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
run_worker_first = ["/api/*", "/cal/*"]

[[d1_databases]]
binding = "DB"
database_name = "worktime"
database_id = "REPLACE_WITH_YOUR_D1_ID"

[vars]
# Set to "false" after you have created your accounts
ALLOW_REGISTRATION = "true"
